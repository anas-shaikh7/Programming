<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            height: 500px;
            width: 500px;
            background-color: blue;
            position: relative;
        }
        
        .ball {
        position: absolute;
        left: 0;
        bottom: 0;
            background-color: rgb(255, 0, 0);
            height: 50px;
            width: 50px;
            border-radius: 70px;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation:  xaxis 3s linear infinite, yaxis 1s ease-out infinite alternate;


        }

        @keyframes yaxis {
            from {
                bottom: 0%;
            }

            to {
bottom: 100%;
            }
        }

        @keyframes xaxis {
            from {
                left: 0%;

            }

            to {
            left: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="ball transition"></div>
    </div>
</body>

</html>
