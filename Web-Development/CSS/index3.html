<!DOCTYPE html>
<html>
<head>
  <style>
    .box {
      min-width: 150px; /* Minimum is 30% of the screen width */
      background-color: red;
      border: 2px solid green;
      padding: 10px;
      width: auto;    }
  </style>
</head>
<body>

  <div class="box">Short</div>
  <br>
  <div class="box">This is a much longer line of text that will force the box to grow wider than 30vw.</div>

</body>
</html>
