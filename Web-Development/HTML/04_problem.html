<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Scores Euro 2024</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f3f4f6;
        color: #333;
        text-align: center;
    }

    h1 {
        margin: 20px 0;
        font-size: 2.5rem;
        color: #c80d0d;
    }

    table {
        margin: 20px auto;
        border-collapse: collapse;
        width: 80%;
        background-color: #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    th,
    td {
        padding: 15px;
        border: 1px solid #ddd;
        text-align: center;
        font-size: 1rem;
    }

    th {
        background-color: #007BFF;
        color: #fff;
        font-weight: bold;
    }

    tbody tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    tbody tr:hover {
        background-color: #f1f1f1;
    }

    td {
        color: #333;
    }

    td:nth-child(2) {
        font-weight: bold;
    }
</style>

<body>
    <h1>Euro 2024</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Goals</th>
                <th>Match</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Cristiano Ronaldo</td>
                <td>7</td>
                <td>Portugal vs France</td>
            </tr>
            <tr>
                <td>Kylian Mbappe</td>
                <td>2</td>
                <td>Portugal vs France</td>
            </tr>
            <tr>
                <td>Karim Benzema</td>
                <td>0</td>
                <td>Absent</td>
            </tr>
        </tbody>


    </table>
</body>

</html>
